  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// DayLog 서버 버전: Electron IPC(daylogAPI)를 Supabase(로그인 + DB + 파일 저장)로 대체
(function () {
  // ▼▼▼ 여기에 Supabase 프로젝트 값을 넣으세요 (Project Settings → API) ▼▼▼
  const SUPABASE_URL = 'https://여기에프로젝트ID.supabase.co';
  const SUPABASE_ANON_KEY = '여기에_anon_public_키';
  // ▲▲▲ anon(public) 키는 공개되어도 안전해요. service_role 키는 절대 넣지 마세요. ▲▲▲

  const BUCKET = 'attachments';
  const MAX_FILE_SIZE = 50 * 1024 * 1024; // Supabase 무료 플랜 파일당 한도
  const DEFAULT_SETTINGS = { bgBlur: 20, dayPhotoBlur: 0, fontScale: 100, notePad: '', dayBgMode: 'photo', interactionEffects: true, soundEffects: true };
  const EXT = {
    image: ['jpg', 'jpeg', 'png', 'webp', 'gif', 'bmp', 'svg'],
    audio: ['mp3', 'wav', 'ogg', 'm4a', 'aac', 'flac'],
    video: ['mp4', 'mov', 'webm', 'm4v'],
  };
  const ALL_EXT = Object.values(EXT).flat();
  const MIME = { jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', webp:'image/webp', gif:'image/gif', bmp:'image/bmp', svg:'image/svg+xml', mp3:'audio/mpeg', wav:'audio/wav', ogg:'audio/ogg', m4a:'audio/mp4', aac:'audio/aac', flac:'audio/flac', mp4:'video/mp4', mov:'video/quicktime', webm:'video/webm', m4v:'video/mp4' };

  const configured = !/여기에/.test(SUPABASE_URL + SUPABASE_ANON_KEY);
  const sb = configured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
  let user = null;
  let resolveAuth;
  const authReady = new Promise((r) => { resolveAuth = r; });

  // ---------- 로그인 UI ----------
  const $ = (id) => document.getElementById(id);
  const loginEl = () => $('loginScreen');
  const msgEl = () => $('loginMsg');
  let mode = 'signin';
  function setMsg(t, ok) { const m = msgEl(); m.textContent = t || ''; m.className = 'login-msg' + (ok ? ' ok' : ''); }
  function setMode(m) {
    mode = m;
    $('loginSubmit').textContent = m === 'signin' ? '로그인' : '회원가입';
    $('loginSwitchText').textContent = m === 'signin' ? '아직 계정이 없나요?' : '이미 계정이 있나요?';
    $('loginSwitchBtn').textContent = m === 'signin' ? '회원가입' : '로그인';
    $('loginPassword').autocomplete = m === 'signin' ? 'current-password' : 'new-password';
    setMsg('');
  }
  function enterApp(u) {
    user = u;
    loginEl().classList.add('hidden');
    const em = $('accountEmail'); if (em) em.textContent = u.email || '';
    resolveAuth();
  }
  function friendly(err) {
    const m = (err && err.message) || '';
    if (/Invalid login/i.test(m)) return '이메일 또는 비밀번호가 맞지 않아요.';
    if (/already registered|already been registered/i.test(m)) return '이미 가입된 이메일이에요. 로그인해 주세요.';
    if (/Password should be/i.test(m)) return '비밀번호는 6자 이상이어야 해요.';
    if (/valid email|invalid format/i.test(m)) return '이메일 형식을 확인해 주세요.';
    if (/Email not confirmed/i.test(m)) return '이메일 인증을 먼저 완료해 주세요. 메일함을 확인해 보세요.';
    if (/rate limit/i.test(m)) return '요청이 너무 많아요. 잠시 후 다시 시도해 주세요.';
    return '오류가 발생했어요: ' + m;
  }
  async function init() {
    if (!configured) {
      loginEl().classList.remove('hidden');
      $('loginForm').classList.add('hidden');
      setMsg('Supabase 설정이 아직 없어요. index.html 위쪽의 SUPABASE_URL과 SUPABASE_ANON_KEY를 채워 주세요.');
      return;
    }
    const { data } = await sb.auth.getSession();
    if (data && data.session) { enterApp(data.session.user); }
    else { loginEl().classList.remove('hidden'); }
    $('loginSwitchBtn').addEventListener('click', () => setMode(mode === 'signin' ? 'signup' : 'signin'));
    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = $('loginEmail').value.trim();
      const password = $('loginPassword').value;
      if (!email || !password) { setMsg('이메일과 비밀번호를 입력해 주세요.'); return; }
      const btn = $('loginSubmit'); btn.disabled = true; setMsg('');
      try {
        if (mode === 'signin') {
          const { data, error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
          enterApp(data.user);
        } else {
          const { data, error } = await sb.auth.signUp({ email, password });
          if (error) throw error;
          if (data.session) enterApp(data.user);
          else { setMsg('가입 확인 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인해 주세요.', true); setMode('signin'); setMsg('가입 확인 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인해 주세요.', true); }
        }
      } catch (err) { setMsg(friendly(err)); }
      finally { btn.disabled = false; }
    });
    const lo = $('logoutBtn');
    if (lo) lo.addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

  // ---------- 유틸 ----------
  const extOf = (n) => { const i = n.lastIndexOf('.'); return i < 0 ? '' : n.slice(i + 1).toLowerCase(); };
  const typeOf = (e) => { for (const [t, l] of Object.entries(EXT)) if (l.includes(e)) return t; return null; };
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
  const need = async () => { await authReady; };
  const okOrThrow = ({ error }) => { if (error) throw error; };

  // 서명된 URL 캐시 (50분)
  const urlCache = new Map();
  async function signAll(atts) {
    const now = Date.now();
    const todo = atts.filter((a) => !(urlCache.get(a.id) && urlCache.get(a.id).exp > now));
    for (let i = 0; i < todo.length; i += 100) {
      const chunk = todo.slice(i, i + 100);
      const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(chunk.map((a) => a.path), 3600);
      if (error) { console.error(error); continue; }
      data.forEach((d, k) => { if (d && d.signedUrl) urlCache.set(chunk[k].id, { url: d.signedUrl, exp: now + 50 * 60 * 1000 }); });
    }
    return atts.filter((a) => urlCache.get(a.id)).map((a) => ({ id: a.id, filename: a.filename, type: a.type, url: urlCache.get(a.id).url }));
  }
  const byOrder = (a, b) => (a.position - b.position) || String(a.created_at || '').localeCompare(String(b.created_at || ''));

  async function cleanupDate(date) {
    const { data: r } = await sb.from('records').select('memo,color').eq('user_id', user.id).eq('date', date).maybeSingle();
    if (!r) return;
    const { count } = await sb.from('attachments').select('id', { count: 'exact', head: true }).eq('user_id', user.id).eq('date', date);
    if (!(r.memo && r.memo.trim()) && !r.color && !count) await sb.from('records').delete().eq('user_id', user.id).eq('date', date);
  }
  async function ensureRecord(date) {
    const { error } = await sb.from('records').upsert({ user_id: user.id, date }, { onConflict: 'user_id,date', ignoreDuplicates: true });
    if (error) throw error;
  }

  async function addFile(date, file) {
    try {
      if (!file) return { error: '파일을 찾을 수 없습니다.' };
      if (file.size > MAX_FILE_SIZE) return { error: '파일 크기가 너무 큽니다. (최대 50MB까지 첨부할 수 있어요)' };
      const ext = extOf(file.name);
      const type = typeOf(ext);
      if (!type) return { error: '지원하지 않는 파일 형식입니다. (이미지 / GIF / 오디오 / 동영상만 가능)' };
      const id = uuid();
      const path = `${user.id}/${date}/${id}.${ext}`;
      const up = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type || MIME[ext] || 'application/octet-stream', upsert: false });
      if (up.error) throw up.error;
      await ensureRecord(date);
      const { count } = await sb.from('attachments').select('id', { count: 'exact', head: true }).eq('user_id', user.id).eq('date', date);
      const ins = await sb.from('attachments').insert({ id, user_id: user.id, date, filename: file.name, type, path, position: count || 0 });
      if (ins.error) { await sb.storage.from(BUCKET).remove([path]); throw ins.error; }
      const [signed] = await signAll([{ id, path, filename: file.name, type }]);
      return { id, filename: file.name, type, url: signed ? signed.url : '' };
    } catch (e) {
      console.error(e);
      return { error: '파일을 첨부하는 중 오류가 발생했습니다.' };
    }
  }

  function pickFiles() {
    return new Promise((resolve) => {
      const input = document.createElement('input');
      input.type = 'file'; input.multiple = true;
      input.accept = ALL_EXT.map((e) => '.' + e).join(',');
      input.style.display = 'none';
      document.body.appendChild(input);
      let done = false;
      const finish = (f) => { if (done) return; done = true; input.remove(); resolve(f); };
      input.addEventListener('change', () => finish(Array.from(input.files || [])));
      input.addEventListener('cancel', () => finish([]));
      input.click();
    });
  }

  async function recolor(matchHex, newColor) {
    const q = sb.from('records').select('date,color').eq('user_id', user.id).not('color', 'is', null);
    const { data, error } = await q;
    if (error) throw error;
    const targets = data.filter((r) => matchHex === null || r.color.toLowerCase() === String(matchHex).toLowerCase());
    for (const r of targets) {
      const { error: e } = await sb.from('records').update({ color: newColor }).eq('user_id', user.id).eq('date', r.date);
      if (e) throw e;
      if (!newColor) await cleanupDate(r.date);
    }
    return { ok: true, count: targets.length };
  }

  const wrap = (fn, fallback) => async (...a) => { await need(); try { return await fn(...a); } catch (e) { console.error(e); return fallback; } };

  window.daylogAPI = {
    getAllRecords: wrap(async () => {
      const [r, a] = await Promise.all([
        sb.from('records').select('date,memo,color').eq('user_id', user.id),
        sb.from('attachments').select('id,date,filename,type,path,position,created_at').eq('user_id', user.id),
      ]);
      if (r.error) throw r.error; if (a.error) throw a.error;
      const signed = await signAll(a.data);
      const meta = new Map(a.data.map((x) => [x.id, x]));
      const perDate = {};
      for (const s of signed) (perDate[meta.get(s.id).date] = perDate[meta.get(s.id).date] || []).push(s);
      for (const d in perDate) perDate[d].sort((x, y) => byOrder(meta.get(x.id), meta.get(y.id)));
      const summary = {};
      const dates = new Set([...r.data.map((x) => x.date), ...Object.keys(perDate)]);
      const rec = new Map(r.data.map((x) => [x.date, x]));
      for (const date of dates) {
        const x = rec.get(date) || { memo: '', color: null };
        const memo = x.memo || '';
        const atts = perDate[date] || [];
        summary[date] = { hasMemo: memo.trim().length > 0, memoPreview: memo.trim().slice(0, 60), hasAttachments: atts.length > 0, attachments: atts, color: x.color || null };
      }
      return summary;
    }, {}),
    getRecord: wrap(async (date) => {
      const [r, a] = await Promise.all([
        sb.from('records').select('memo,color').eq('user_id', user.id).eq('date', date).maybeSingle(),
        sb.from('attachments').select('id,filename,type,path,position,created_at').eq('user_id', user.id).eq('date', date),
      ]);
      if (a.error) throw a.error;
      const list = a.data.sort(byOrder);
      const signed = await signAll(list);
      const order = new Map(list.map((x, i) => [x.id, i]));
      signed.sort((x, y) => order.get(x.id) - order.get(y.id));
      return { memo: (r.data && r.data.memo) || '', attachments: signed, color: (r.data && r.data.color) || null };
    }, { memo: '', attachments: [], color: null }),
    saveMemo: wrap(async (date, memo) => {
      okOrThrow(await sb.from('records').upsert({ user_id: user.id, date, memo }, { onConflict: 'user_id,date' }));
      await cleanupDate(date);
      return true;
    }, false),
    addAttachment: async (date) => {
      await need();
      const files = await pickFiles();
      if (!files.length) return { canceled: true };
      const results = [];
      for (const f of files) results.push(await addFile(date, f));
      return { results };
    },
    addAttachmentFromPath: async (date, file) => { await need(); return addFile(date, file); },
    deleteAttachment: wrap(async (date, id) => {
      const { data } = await sb.from('attachments').select('path').eq('id', id).eq('user_id', user.id).maybeSingle();
      if (data) await sb.storage.from(BUCKET).remove([data.path]);
      okOrThrow(await sb.from('attachments').delete().eq('id', id).eq('user_id', user.id));
      urlCache.delete(id);
      await cleanupDate(date);
      return true;
    }, false),
    deleteRecord: wrap(async (date) => {
      const { data } = await sb.from('attachments').select('id,path').eq('user_id', user.id).eq('date', date);
      if (data && data.length) { await sb.storage.from(BUCKET).remove(data.map((x) => x.path)); data.forEach((x) => urlCache.delete(x.id)); }
      okOrThrow(await sb.from('attachments').delete().eq('user_id', user.id).eq('date', date));
      okOrThrow(await sb.from('records').delete().eq('user_id', user.id).eq('date', date));
      return true;
    }, false),
    reorderAttachments: wrap(async (date, ids) => {
      for (let i = 0; i < ids.length; i++) {
        okOrThrow(await sb.from('attachments').update({ position: i }).eq('id', ids[i]).eq('user_id', user.id));
      }
      return true;
    }, false),
    getSettings: wrap(async () => {
      const { data } = await sb.from('settings').select('data').eq('user_id', user.id).maybeSingle();
      return { ...DEFAULT_SETTINGS, ...((data && data.data) || {}) };
    }, { ...DEFAULT_SETTINGS }),
    saveSettings: wrap(async (partial) => {
      const { data } = await sb.from('settings').select('data').eq('user_id', user.id).maybeSingle();
      const m = { ...DEFAULT_SETTINGS, ...((data && data.data) || {}), ...(partial || {}) };
      if (typeof m.bgBlur === 'number') m.bgBlur = Math.max(0, Math.min(100, Math.round(m.bgBlur)));
      if (typeof m.dayPhotoBlur === 'number') m.dayPhotoBlur = Math.max(0, Math.min(100, Math.round(m.dayPhotoBlur)));
      if (m.dayBgMode !== 'photo' && m.dayBgMode !== 'color') m.dayBgMode = 'photo';
      okOrThrow(await sb.from('settings').upsert({ user_id: user.id, data: m }, { onConflict: 'user_id' }));
      return m;
    }, null),
    saveDayColor: wrap(async (date, color) => {
      if (color) okOrThrow(await sb.from('records').upsert({ user_id: user.id, date, color }, { onConflict: 'user_id,date' }));
      else { okOrThrow(await sb.from('records').update({ color: null }).eq('user_id', user.id).eq('date', date)); await cleanupDate(date); }
      return true;
    }, false),
    recolorAllDayColor: wrap((o, n) => (!o || !n) ? { ok: false, count: 0 } : recolor(o, n), { ok: false, count: 0 }),
    resetAllDayColors: wrap(() => recolor(null, null), { ok: false, count: 0 }),
    resetDayColorByHex: wrap((h) => !h ? { ok: false, count: 0 } : recolor(h, null), { ok: false, count: 0 }),
  };
})();

</script>
<script>
(function () {
  const state = {
    year: new Date().getFullYear(),
    month: new Date().getMonth(), // 0-indexed
    selectedDate: null,
    recordsSummary: {},
    saveTimer: null,
    currentAttachments: [], // 현재 상세 패널에 열려 있는 날짜의 첨부파일 목록 (순서 = 배경 우선순위)
    lightboxList: [],       // 라이트박스에서 좌우로 넘길 수 있는 첨부파일 목록
    lightboxIndex: -1,
    settings: {
      bgBlur: 20, // 0~100 (1 단위), 실제 흐림 px 값은 훨씬 작은 범위로 환산해서 적용 (상세 화면 배경)
      dayPhotoBlur: 0, // 0~100 (1 단위) - 캘린더 일자 칸 사진 배경용
      fontScale: 100, // 50~200 (10 단위, %) - 텍스트 크기 (상세 입력창 / 메인 미리보기 / 왼쪽 메모장)
      notePad: '',
      dayBgMode: 'photo', // 'photo'(첨부 사진 표시) | 'color'(지정 색상만 표시, 사진은 표시하지 않음)
      interactionEffects: true, // 날짜 칸 "돋보기" 효과를 켜고 끄는 설정
      soundEffects: true, // 날짜 칸을 선택(클릭)할 때 효과음을 재생할지 여부
    }, // 전역 설정 (설정 탭 + 왼쪽 메모 탭에서 관리)
    lightboxZoom: 1, // 라이트박스에서 휠로 조절하는 현재 확대 배율
    lightboxPanX: 0, // 확대 상태에서 드래그로 옮긴 가로 위치
    lightboxPanY: 0, // 확대 상태에서 드래그로 옮긴 세로 위치
    settingsSaveTimer: null,
    colorPopoverDate: null, // 색상 팝오버가 열려 있는 날짜
    colorSaveTimer: null,
    paletteEditHex: null, // null이 아니면, 이 색상(소문자 hex)을 쓰는 모든 날짜를 실시간으로 함께 바꾸는 편집 중
    paletteRecolorTimer: null,
  };

  const yearMonthEl = document.getElementById('yearMonth');
  const calendarGrid = document.getElementById('calendarGrid');
  const prevYearBtn = document.getElementById('prevYear');
  const prevMonthBtn = document.getElementById('prevMonth');
  const nextMonthBtn = document.getElementById('nextMonth');
  const nextYearBtn = document.getElementById('nextYear');
  const todayBtn = document.getElementById('todayBtn');

  const overlay = document.getElementById('overlay');
  const detailPanel = document.getElementById('detailPanel');
  const detailBg = document.getElementById('detailBg');
  const detailDate = document.getElementById('detailDate');
  const closeDetailBtn = document.getElementById('closeDetail');
  const memoInput = document.getElementById('memoInput');
  const addFileBtn = document.getElementById('addFileBtn');
  const attachmentsSection = document.getElementById('attachmentsSection');
  const attachmentsList = document.getElementById('attachmentsList');
  const dropOverlay = document.getElementById('dropOverlay');
  const deleteRecordBtn = document.getElementById('deleteRecordBtn');
  const saveStatus = document.getElementById('saveStatus');

  const lightbox = document.getElementById('lightbox');
  const lightboxContent = document.getElementById('lightboxContent');
  const lightboxPrev = document.getElementById('lightboxPrev');
  const lightboxNext = document.getElementById('lightboxNext');
  const toast = document.getElementById('toast');

  const memoDock = document.getElementById('memoDock');
  const memoTabBtn = document.getElementById('memoTabBtn');
  const memoPadInput = document.getElementById('memoPadInput');

  const settingsBtn = document.getElementById('settingsBtn');
  const settingsOverlay = document.getElementById('settingsOverlay');
  const closeSettingsBtn = document.getElementById('closeSettings');
  const settingBlurSlider = document.getElementById('settingBlurSlider');
  const settingBlurValue = document.getElementById('settingBlurValue');
  const settingDayPhotoBlurSlider = document.getElementById('settingDayPhotoBlurSlider');
  const settingDayPhotoBlurValue = document.getElementById('settingDayPhotoBlurValue');
  const settingFontSizeSlider = document.getElementById('settingFontSizeSlider');
  const settingFontSizeValue = document.getElementById('settingFontSizeValue');
  const settingInteractionEffectsBtn = document.getElementById('settingInteractionEffects');
  const settingSoundEffectsBtn = document.getElementById('settingSoundEffects');

  const dayBgModeBtn = document.getElementById('dayBgModeBtn');

  const colorPopover = document.getElementById('colorPopover');
  const colorPreview = document.getElementById('colorPreview');
  const colorR = document.getElementById('colorR');
  const colorG = document.getElementById('colorG');
  const colorB = document.getElementById('colorB');
  const colorRVal = document.getElementById('colorRVal');
  const colorGVal = document.getElementById('colorGVal');
  const colorBVal = document.getElementById('colorBVal');
  const colorPresets = document.getElementById('colorPresets');
  const colorResetBtn = document.getElementById('colorResetBtn');

  function pad(n) {
    return String(n).padStart(2, '0');
  }
  function formatDateKey(y, m, d) {
    return `${y}-${pad(m + 1)}-${pad(d)}`;
  }
  function formatKoreanDate(dateKey) {
    const [y, m, d] = dateKey.split('-').map(Number);
    return `${y}년 ${m}월 ${d}일`;
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.remove('hidden');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.add('hidden'), 2500);
  }

  async function refreshSummary() {
    try {
      state.recordsSummary = await window.daylogAPI.getAllRecords();
    } catch (err) {
      console.error(err);
      state.recordsSummary = {};
    }
  }

  // 토스 스타일 월 전환: 제목이 이동 방향에 따라 아래/위에서 부드럽게 올라온다.
  // (설정의 "인터랙션 효과"가 꺼져 있거나 시스템이 동작 줄이기 상태면 건너뛴다)
  let lastTitleKey = null;
  function animateMonthTitle(year, month) {
    const key = year * 12 + month;
    const prev = lastTitleKey;
    lastTitleKey = key;
    if (prev === null || prev === key) return;
    if (state.settings && state.settings.interactionEffects === false) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (!yearMonthEl.animate) return;
    const dir = key > prev ? 1 : -1;
    yearMonthEl.animate(
      [
        { transform: `translateY(${dir * 14}px)`, opacity: 0 },
        { transform: 'translateY(0)', opacity: 1 },
      ],
      { duration: 280, easing: 'cubic-bezier(0.2, 0, 0, 1)' }
    );
  }

  function renderCalendar() {
    const { year, month } = state;
    yearMonthEl.textContent = `${year}년 ${month + 1}월`;
    animateMonthTitle(year, month);
    calendarGrid.innerHTML = '';

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = new Date();
    const todayKey = formatDateKey(today.getFullYear(), today.getMonth(), today.getDate());

    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement('div');
      empty.className = 'day empty';
      calendarGrid.appendChild(empty);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const key = formatDateKey(year, month, d);
      const info = state.recordsSummary[key];

      const cell = document.createElement('button');
      cell.className = 'day';
      cell.type = 'button';
      cell.dataset.date = key;
      if (key === todayKey) cell.classList.add('today');
      if (info && (info.hasMemo || info.hasAttachments)) cell.classList.add('has-record');

      // 사진이 첨부된 날짜는 그 사진을 칸 배경으로 쓴다 (사진 모드).
      // 색상 모드에서는 지정한 색상만 표시하고, 색이 없는 날짜는 사진이 있어도
      // 배경을 비워둔다 (색상 모드 = 색상으로만 표시, 사진은 표시하지 않음).
      const bgPhoto = info && info.attachments && info.attachments.find((a) => a.type === 'image');
      const bgColor = info && info.color;
      const colorMode = (state.settings.dayBgMode || 'photo') === 'color';

      const chosen = colorMode
        ? (bgColor ? 'color' : null)
        : (bgPhoto ? 'photo' : null);

      if (chosen === 'photo') {
        cell.style.setProperty('--day-photo-url', `url("${bgPhoto.url}")`);
        cell.classList.add('day-photo-bg');
      } else if (chosen === 'color') {
        cell.style.backgroundColor = bgColor;
        cell.classList.add('day-custom-color');
        if (isLightColor(bgColor)) cell.classList.add('day-color-light-bg');
      }

      const num = document.createElement('span');
      num.className = 'day-num';
      num.textContent = String(d);
      cell.appendChild(num);

      // 메인 화면에서도 메모 내용을 바로 볼 수 있도록 미리보기 텍스트 표시
      if (info && info.memoPreview) {
        const memoPreview = document.createElement('div');
        memoPreview.className = 'day-memo';
        memoPreview.textContent = info.memoPreview;
        cell.appendChild(memoPreview);
      }

      const marks = document.createElement('div');
      marks.className = 'day-marks';
      if (info && info.hasMemo) {
        const dot = document.createElement('span');
        dot.className = 'mark mark-memo';
        marks.appendChild(dot);
      }
      if (info && info.hasAttachments) {
        const dot = document.createElement('span');
        dot.className = 'mark mark-file';
        marks.appendChild(dot);
      }
      cell.appendChild(marks);

      cell.addEventListener('click', () => {
        playDaySelectSound();
        openDetail(key);
      });

      // 마우스 오른쪽 클릭 -> 이 날짜 칸의 색상을 바꾸는 팝오버를 연다.
      cell.addEventListener('contextmenu', (e) => openColorPopover(key, e));

      // 마우스를 올리면 이 칸이 커지면서 주변 칸들을 밀어내는 "돋보기"(하이라이트) 효과.
      // (설정 탭의 "인터랙션 효과" 토글이 꺼져 있으면 확대 효과는 동작하지 않지만,
      // 하이라이트 효과음은 그 설정과 무관하게 항상 재생된다.)
      cell.addEventListener('mouseenter', () => {
        if (state.settings.interactionEffects !== false) {
          magnifyAroundCell(cell);
        }
        playHighlightSound();
      });

      calendarGrid.appendChild(cell);
    }

    fitDayMemos();
  }

  // ---------- 날짜 칸 메모 미리보기: 칸 안에서 잘리지 않는 선까지만 줄 수 표시 ----------
  // grid-auto-rows가 minmax(0, 1fr)라 칸 높이가 창 크기에 따라 계속 바뀌는데,
  // 고정된 줄 수(-webkit-line-clamp)로 자르면 칸이 작을 땐 넘치고 클 땐 공간이
  // 남는다. 그래서 매번 칸의 실제 남는 높이를 재서 그만큼만 줄을 보여준다.
  function fitDayMemos() {
    const cells = calendarGrid.querySelectorAll('.day:not(.empty)');
    cells.forEach((cell) => {
      const memoEl = cell.querySelector('.day-memo');
      if (!memoEl) return;
      const numEl = cell.querySelector('.day-num');
      const marksEl = cell.querySelector('.day-marks');

      const cellStyle = getComputedStyle(cell);
      const paddingTop = parseFloat(cellStyle.paddingTop) || 0;
      const paddingBottom = parseFloat(cellStyle.paddingBottom) || 0;

      const memoStyle = getComputedStyle(memoEl);
      const marginTop = parseFloat(memoStyle.marginTop) || 0;
      let lineHeight = parseFloat(memoStyle.lineHeight);
      if (!lineHeight || Number.isNaN(lineHeight)) {
        lineHeight = parseFloat(memoStyle.fontSize) * 1.35;
      }

      const used = paddingTop + paddingBottom
        + (numEl ? numEl.offsetHeight : 0)
        + (marksEl ? marksEl.offsetHeight : 0)
        + marginTop;
      const available = cell.clientHeight - used;

      if (available < lineHeight * 0.6) {
        // 한 줄도 온전히 들어갈 공간이 없으면 잘린 글자가 보이는 대신 아예 숨긴다.
        memoEl.style.display = 'none';
      } else {
        memoEl.style.display = '';
        const maxLines = Math.max(1, Math.min(8, Math.floor(available / lineHeight)));
        memoEl.style.webkitLineClamp = String(maxLines);
      }
    });
  }

  // 창 크기를 바꾸면(특히 최소 크기 근처) 칸 높이가 바뀌므로 다시 계산한다.
  let dayMemoFitResizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(dayMemoFitResizeTimer);
    dayMemoFitResizeTimer = setTimeout(fitDayMemos, 120);
  });

  // ---------- 날짜 칸 "돋보기" 효과 transform 적용 ----------
  const cellMagnify = new WeakMap(); // cell -> { x, y, scale }

  function applyCellTransform(cell) {
    const m = cellMagnify.get(cell);
    if (!m) {
      cell.style.transform = '';
      return;
    }
    const { x, y, scale } = m;
    if (Math.abs(x) < 0.05 && Math.abs(y) < 0.05 && scale === 1) {
      cell.style.transform = '';
    } else {
      cell.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${scale.toFixed(3)})`;
    }
  }

  // ---------- 날짜 칸 "돋보기" 효과: 마우스를 올린 칸이 커지면서 주변 칸을 밀어낸다 ----------
  // 격자(grid) 자체의 트랙 크기를 바꾸는 대신, 마우스가 올라간 칸을 기준으로
  // 화면상 거리(픽셀)를 계산해서 가까운 칸일수록 크게 밀려나도록 각 칸에
  // translate + scale을 입힌다. 거리 계산은 실제 화면 좌표(getBoundingClientRect)를
  // 쓰기 때문에 같은 행/열은 물론 대각선 방향 칸도 자연스럽게 밀려난다.
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function magnifyAroundCell(hoveredCell) {
    if (prefersReducedMotion) return;

    const cells = calendarGrid.querySelectorAll('.day:not(.empty)');
    const hRect = hoveredCell.getBoundingClientRect();
    const hcx = hRect.left + hRect.width / 2;
    const hcy = hRect.top + hRect.height / 2;
    const unit = hRect.width || 80;
    const influenceRadius = unit * 2.3; // 이 거리 밖의 칸은 영향받지 않는다
    const maxPush = unit * 0.24; // 가장 가까운 칸이 밀려나는 최대 거리

    cells.forEach((cell) => {
      if (cell === hoveredCell) {
        cell.classList.add('day-magnified');
        cellMagnify.set(cell, { x: 0, y: 0, scale: 1.18 });
        applyCellTransform(cell);
        return;
      }
      cell.classList.remove('day-magnified');

      const r = cell.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const dx = cx - hcx;
      const dy = cy - hcy;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;

      if (dist >= influenceRadius) {
        cellMagnify.delete(cell);
        applyCellTransform(cell);
        return;
      }

      const strength = 1 - dist / influenceRadius;
      const push = strength * maxPush;
      const px = (dx / dist) * push;
      const py = (dy / dist) * push;
      const shrink = 1 - strength * 0.06; // 밀려나는 칸은 살짝 작아져서 대비를 준다
      cellMagnify.set(cell, { x: px, y: py, scale: shrink });
      applyCellTransform(cell);
    });
  }

  function resetMagnify() {
    calendarGrid.querySelectorAll('.day').forEach((cell) => {
      cell.classList.remove('day-magnified');
      cellMagnify.delete(cell);
      applyCellTransform(cell);
    });
  }
  // 마우스가 캘린더 영역을 완전히 벗어나면 모든 칸을 원래 크기로 되돌린다.
  // (칸 사이를 이동할 때는 매번 mouseenter가 새로 계산해주므로 별도 리셋이 필요 없다.)
  calendarGrid.addEventListener('mouseleave', resetMagnify);

  // ---------- 날짜 칸을 클릭(선택)할 때 재생하는 효과음 ----------
  // 오디오 파일을 따로 두지 않고 Web Audio API로 짧은 "톡" 소리를 그때그때 합성한다.
  // AudioContext는 브라우저 자동재생 정책상 사용자 제스처(클릭) 이후에만 만들 수 있으므로
  // 최초 클릭 시점에 지연 생성한다.
  let audioCtx = null;
  let lastHighlightSoundAt = 0; // 하이라이트 효과음 최근 재생 시각 (연속 재생 방지용 스로틀)
  function getAudioCtx() {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playDaySelectSound() {
    if (state.settings.soundEffects === false) return;
    const ctx = getAudioCtx();
    if (!ctx) return;

    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(720, now);
    osc.frequency.exponentialRampToValueAtTime(1000, now + 0.06);

    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.16, now + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.13);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.14);
  }

  // 날짜 칸이 "돋보기"로 하이라이트될 때(마우스 오버) 재생하는, 선택음과 구분되는 짧고 가벼운 효과음.
  // 마우스를 빠르게 훑으면 칸을 옮길 때마다 계속 울릴 수 있으므로 최소 간격을 두어 소리가 뭉치지 않게 한다.
  function playHighlightSound() {
    if (state.settings.soundEffects === false) return;
    if (prefersReducedMotion) return; // 하이라이트 효과 자체가 꺼져 있을 땐 소리도 울리지 않는다

    const nowMs = performance.now();
    if (nowMs - lastHighlightSoundAt < 45) return;
    lastHighlightSoundAt = nowMs;

    const ctx = getAudioCtx();
    if (!ctx) return;

    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(1400, now);
    osc.frequency.exponentialRampToValueAtTime(1150, now + 0.035);

    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.05, now + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.06);
  }

  // 날짜 칸(선택/하이라이트음은 위에서 별도로 처리)을 제외한, 그 외 모든 버튼과의
  // 상호작용(클릭)에 공통으로 재생하는 일반 UI 효과음. 버튼마다 따로 연결할 필요 없이
  // document에서 클릭 이벤트를 위임받아 처리한다.
  function playUIClickSound() {
    if (state.settings.soundEffects === false) return;
    const ctx = getAudioCtx();
    if (!ctx) return;

    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = 'square';
    osc.frequency.setValueAtTime(520, now);
    osc.frequency.exponentialRampToValueAtTime(360, now + 0.045);

    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.06, now + 0.006);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.09);
  }

  // capture 단계에서 감지해야, 개별 버튼 핸들러가 e.stopPropagation()을 호출해서
  // 버블링을 막는 경우에도(예: 라이트박스 이전/다음 버튼) 효과음이 씹히지 않는다.
  // 각 클릭마다 새 오실레이터/게인 노드를 만들어 재생하므로, 연속으로 빠르게
  // 눌러도 이전 소리가 잘리지 않고 겹쳐서 재생된다.
  document.addEventListener(
    'click',
    (e) => {
      const btn = e.target.closest('button');
      if (!btn || btn.classList.contains('day')) return; // 날짜 칸은 자체적으로 선택/하이라이트음을 재생한다
      playUIClickSound();
    },
    true
  );

  // TODAY 버튼으로 다른 달에서 오늘이 있는 달로 이동할 때 재생하는 "스윽" 이동음.
  // 방향(전/후)에 따라 음높이가 오르내리는 쪽을 다르게 해서 이동 방향을 은은하게 느낄 수 있게 한다.
  function playScrollSound(direction) {
    if (state.settings.soundEffects === false) return;
    const ctx = getAudioCtx();
    if (!ctx) return;

    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    const startFreq = direction === 'next' ? 480 : 720;
    const endFreq = direction === 'next' ? 760 : 440;

    osc.type = 'sine';
    osc.frequency.setValueAtTime(startFreq, now);
    osc.frequency.exponentialRampToValueAtTime(endFreq, now + 0.16);

    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.09, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.23);
  }

  // ---------- 정사각형 썸네일 생성 (첨부 목록 / 호버 미리보기 공용) ----------
  // type별로 클릭하면 열리는 라이트박스에서 실제 재생/컨트롤을 하도록,
  // 여기서는 깔끔한 정사각형 미리보기만 만든다.
  function buildThumbButton(a, { thumbClass, playIconClass, audioIconClass }, list) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = thumbClass;
    btn.title = a.filename;

    if (a.type === 'image') {
      const img = document.createElement('img');
      img.src = a.url;
      img.alt = a.filename;
      img.draggable = false;
      btn.appendChild(img);
    } else if (a.type === 'video') {
      const video = document.createElement('video');
      video.src = a.url;
      video.muted = true;
      video.preload = 'metadata';
      video.setAttribute('playsinline', '');
      btn.appendChild(video);
      const play = document.createElement('span');
      play.className = playIconClass;
      play.textContent = '▶';
      btn.appendChild(play);
    } else if (a.type === 'audio') {
      const icon = document.createElement('span');
      icon.className = audioIconClass;
      icon.textContent = '♪';
      btn.appendChild(icon);
    }

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const items = list && list.length ? list : [a];
      const idx = items.findIndex((x) => x.id === a.id);
      openMediaLightbox(items, idx === -1 ? 0 : idx);
    });

    return btn;
  }

  // ---------- 상세 패널 배경 (첨부파일 목록의 첫 번째 항목을 배경으로 사용) ----------
  // 이미지면 그대로 배경 이미지로, 동영상이면 소리 없이 반복 재생되는
  // 배경 영상으로 사용한다. 오디오이거나 첨부파일이 없으면 배경 없음.
  function updateDetailBackground(attachments) {
    const first = (attachments || [])[0];
    detailBg.innerHTML = '';
    detailBg.style.backgroundImage = '';

    if (first && first.type === 'image') {
      detailBg.style.backgroundImage = `url("${first.url}")`;
      detailPanel.classList.add('has-bg');
    } else if (first && first.type === 'video') {
      const video = document.createElement('video');
      video.src = first.url;
      video.muted = true;
      video.loop = true;
      video.autoplay = true;
      video.setAttribute('playsinline', '');
      detailBg.appendChild(video);
      detailPanel.classList.add('has-bg');
    } else {
      detailPanel.classList.remove('has-bg');
    }
  }

  // 배경 흐림도는 더 이상 날짜별로 저장하지 않고, 설정 탭에서 관리하는
  // 전역 값 하나를 CSS 변수로 모든 상세 패널 배경에 동일하게 적용한다.
  // 슬라이더는 0~100(1 단위)으로 세밀하게 움직이지만, 실제 CSS blur는
  // 훨씬 작은 px 범위로 환산한다 (1px만 돼도 시각적으로 꽤 강하게 느껴지기 때문에
  // 최댓값 자체를 낮게 잡았다).
  const BG_BLUR_MAX_PX = 6;
  function bgBlurPercentToPx(percent) {
    return (Math.max(0, Math.min(100, percent)) / 100) * BG_BLUR_MAX_PX;
  }
  function applyBgBlurVar(percent) {
    document.documentElement.style.setProperty('--bg-blur', `${bgBlurPercentToPx(percent)}px`);
  }

  // 캘린더 일자 칸 사진 배경의 흐림도. 셀 자체가 작아서 상세 화면보다 살짝 더
  // 넓은 범위(0~10px)로 환산한다.
  const DAY_PHOTO_BLUR_MAX_PX = 10;
  function dayPhotoBlurPercentToPx(percent) {
    return (Math.max(0, Math.min(100, percent)) / 100) * DAY_PHOTO_BLUR_MAX_PX;
  }
  function applyDayPhotoBlurVar(percent) {
    document.documentElement.style.setProperty('--day-photo-blur', `${dayPhotoBlurPercentToPx(percent)}px`);
  }

  // 텍스트 크기 배율. 50~200(%)을 1(=100%) 기준 배율로 환산해서 CSS 변수로 적용한다.
  function applyFontScaleVar(percent) {
    const clamped = Math.max(50, Math.min(200, percent));
    document.documentElement.style.setProperty('--content-font-scale', String(clamped / 100));
  }

  // ---------- 라이트박스 확대/축소 (휠) 및 이동 (드래그) ----------
  const LIGHTBOX_ZOOM_MIN = 0.5;
  const LIGHTBOX_ZOOM_MAX = 4;
  const LIGHTBOX_ZOOM_STEP = 0.1;

  let lightboxDragging = false;
  let lightboxDidDrag = false;
  let lightboxDragStartX = 0;
  let lightboxDragStartY = 0;
  let lightboxPanStartX = 0;
  let lightboxPanStartY = 0;
  const LIGHTBOX_DRAG_THRESHOLD = 4; // px, 이보다 적게 움직이면 드래그가 아니라 클릭으로 취급

  function currentLightboxMedia() {
    return lightboxContent.querySelector('img, video');
  }

  function applyLightboxTransform() {
    const media = currentLightboxMedia();
    if (!media) return;
    media.style.transform = `translate(${state.lightboxPanX}px, ${state.lightboxPanY}px) scale(${state.lightboxZoom})`;
    media.style.transition = lightboxDragging ? 'none' : 'transform 60ms ease-out';
    media.style.cursor = state.lightboxZoom > 1 ? (lightboxDragging ? 'grabbing' : 'grab') : 'default';
  }

  function resetLightboxZoom() {
    state.lightboxZoom = 1;
    state.lightboxPanX = 0;
    state.lightboxPanY = 0;
    lightboxDragging = false;
    applyLightboxTransform();
  }

  // 확대된 이미지/동영상을 마우스로 눌러 끄는 동안 드래그해서 위치를 옮길 수 있게 한다.
  function startLightboxDrag(e) {
    if (state.lightboxZoom <= 1) return;
    e.preventDefault();
    e.stopPropagation();
    lightboxDragging = true;
    lightboxDidDrag = false;
    lightboxDragStartX = e.clientX;
    lightboxDragStartY = e.clientY;
    lightboxPanStartX = state.lightboxPanX;
    lightboxPanStartY = state.lightboxPanY;
    applyLightboxTransform();
  }

  document.addEventListener('mousemove', (e) => {
    if (!lightboxDragging) return;
    e.preventDefault();
    const dx = e.clientX - lightboxDragStartX;
    const dy = e.clientY - lightboxDragStartY;
    if (!lightboxDidDrag && (Math.abs(dx) > LIGHTBOX_DRAG_THRESHOLD || Math.abs(dy) > LIGHTBOX_DRAG_THRESHOLD)) {
      lightboxDidDrag = true;
    }
    state.lightboxPanX = lightboxPanStartX + dx;
    state.lightboxPanY = lightboxPanStartY + dy;
    applyLightboxTransform();
  });

  document.addEventListener('mouseup', () => {
    if (!lightboxDragging) return;
    lightboxDragging = false;
    applyLightboxTransform();
  });

  // 실제로 드래그해서 옮긴 경우에는 그 뒤에 이어지는 클릭이 라이트박스를 닫지 않도록 막는다.
  lightboxContent.addEventListener('click', (e) => {
    if (lightboxDidDrag) {
      e.stopPropagation();
      lightboxDidDrag = false;
    }
  });

  async function openDetail(dateKey) {
    state.selectedDate = dateKey;
    state.currentAttachments = [];
    detailDate.textContent = formatKoreanDate(dateKey);
    memoInput.value = '';
    attachmentsList.innerHTML = '';
    detailBg.innerHTML = '';
    detailBg.style.backgroundImage = '';
    detailPanel.classList.remove('has-bg');
    saveStatus.textContent = '';

    overlay.classList.remove('hidden');
    requestAnimationFrame(() => overlay.classList.add('show'));

    try {
      const record = await window.daylogAPI.getRecord(dateKey);
      memoInput.value = record.memo || '';
      state.currentAttachments = record.attachments || [];
      renderAttachments(state.currentAttachments);
      updateDetailBackground(state.currentAttachments);
    } catch (err) {
      console.error(err);
      showToast('기록을 불러오는 중 오류가 발생했습니다.');
    }
  }

  function renderAttachments(attachments) {
    attachmentsList.innerHTML = '';
    if (!attachments || attachments.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'attachments-empty';
      empty.textContent = '첨부된 파일이 없습니다. 파일을 이 영역으로 끌어다 놓아도 첨부돼요.';
      attachmentsList.appendChild(empty);
      return;
    }

    attachments.forEach((a, index) => {
      const item = document.createElement('div');
      item.className = 'attachment-item';
      item.draggable = true;
      item.dataset.id = a.id;

      const handle = document.createElement('span');
      handle.className = 'attachment-drag-handle';
      handle.textContent = '⋮⋮';
      handle.title = '드래그해서 순서 바꾸기';
      item.appendChild(handle);

      const thumb = buildThumbButton(a, {
        thumbClass: 'attachment-thumb-btn',
        playIconClass: 'thumb-play',
        audioIconClass: 'thumb-audio-icon',
      }, attachments);
      item.appendChild(thumb);

      const meta = document.createElement('div');
      meta.className = 'attachment-meta';

      const name = document.createElement('span');
      name.className = 'attachment-name';
      name.textContent = a.filename;
      name.title = a.filename;
      meta.appendChild(name);

      if (index === 0) {
        const badge = document.createElement('span');
        badge.className = 'attachment-bg-badge';
        badge.textContent = '배경';
        badge.title = '이 파일이 상세 패널의 배경으로 사용돼요';
        meta.appendChild(badge);
      }

      const delBtn = document.createElement('button');
      delBtn.className = 'attachment-delete';
      delBtn.textContent = '삭제';
      delBtn.addEventListener('click', () => deleteAttachment(a.id));
      meta.appendChild(delBtn);

      item.appendChild(meta);
      wireAttachmentDrag(item, a.id);
      attachmentsList.appendChild(item);
    });
  }

  // ---------- 첨부파일 드래그로 순서 바꾸기 (첫 번째 = 배경) ----------
  let draggingId = null;

  function clearDragIndicators() {
    attachmentsList.querySelectorAll('.attachment-item').forEach((el) => {
      el.classList.remove('drag-over-top', 'drag-over-bottom');
    });
  }

  function wireAttachmentDrag(item, id) {
    item.addEventListener('dragstart', (e) => {
      draggingId = id;
      item.classList.add('is-dragging');
      e.dataTransfer.effectAllowed = 'move';
      try {
        e.dataTransfer.setData('text/plain', id);
      } catch (err) {
        /* 일부 환경에서 setData가 필요 없을 수 있음 */
      }
    });

    item.addEventListener('dragend', () => {
      draggingId = null;
      item.classList.remove('is-dragging');
      clearDragIndicators();
    });

    item.addEventListener('dragover', (e) => {
      if (!draggingId || draggingId === id) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const rect = item.getBoundingClientRect();
      const before = e.clientY - rect.top < rect.height / 2;
      clearDragIndicators();
      item.classList.add(before ? 'drag-over-top' : 'drag-over-bottom');
    });

    item.addEventListener('dragleave', () => {
      item.classList.remove('drag-over-top', 'drag-over-bottom');
    });

    item.addEventListener('drop', async (e) => {
      if (!draggingId || draggingId === id) return;
      e.preventDefault();
      const rect = item.getBoundingClientRect();
      const before = e.clientY - rect.top < rect.height / 2;
      clearDragIndicators();
      await reorderAttachment(draggingId, id, before);
      draggingId = null;
    });
  }

  // sourceId를 targetId 앞/뒤로 옮기고 새 순서를 저장한다.
  async function reorderAttachment(sourceId, targetId, before) {
    const list = state.currentAttachments.slice();
    const fromIndex = list.findIndex((a) => a.id === sourceId);
    if (fromIndex === -1) return;
    const [moved] = list.splice(fromIndex, 1);

    let toIndex = list.findIndex((a) => a.id === targetId);
    if (toIndex === -1) toIndex = list.length;
    if (!before) toIndex += 1;
    list.splice(toIndex, 0, moved);

    if (!state.selectedDate) return;
    try {
      await window.daylogAPI.reorderAttachments(state.selectedDate, list.map((a) => a.id));
      await afterAttachmentsChanged();
    } catch (err) {
      console.error(err);
      showToast('순서를 바꾸는 중 오류가 발생했습니다.');
    }
  }

  // ---------- 라이트박스: 이미지 확대 / 동영상·오디오 재생(탐색 가능) / 좌우 이동 ----------
  function openMediaLightbox(list, index) {
    state.lightboxList = list || [];
    state.lightboxIndex = index || 0;
    resetLightboxZoom();
    renderLightboxItem();
    lightbox.classList.remove('hidden');
  }

  function goToLightboxIndex(newIndex) {
    const len = state.lightboxList.length;
    if (len === 0) return;
    // 양 끝에서 반대편으로 순환 이동
    state.lightboxIndex = (newIndex + len) % len;
    resetLightboxZoom();
    renderLightboxItem();
  }

  function renderLightboxItem() {
    // 다음 항목을 그리기 전에 재생 중이던 미디어를 먼저 멈춘다.
    const playing = lightboxContent.querySelector('video, audio');
    if (playing) {
      try {
        playing.pause();
      } catch (err) {
        /* ignore */
      }
    }

    const a = state.lightboxList[state.lightboxIndex];
    lightboxContent.innerHTML = '';
    if (!a) {
      lightbox.classList.add('hidden');
      return;
    }

    const showNav = state.lightboxList.length > 1;
    lightboxPrev.classList.toggle('hidden', !showNav);
    lightboxNext.classList.toggle('hidden', !showNav);

    if (a.type === 'image') {
      const img = document.createElement('img');
      img.src = a.url;
      img.alt = a.filename;
      img.draggable = false;
      img.addEventListener('mousedown', startLightboxDrag);
      lightboxContent.appendChild(img);
    } else if (a.type === 'video') {
      const video = document.createElement('video');
      video.src = a.url;
      video.controls = true;
      video.autoplay = true;
      video.addEventListener('mousedown', startLightboxDrag);
      video.addEventListener('click', (e) => e.stopPropagation());
      lightboxContent.appendChild(video);
    } else if (a.type === 'audio') {
      const card = document.createElement('div');
      card.className = 'lightbox-audio-card';
      card.addEventListener('click', (e) => e.stopPropagation());

      const icon = document.createElement('div');
      icon.className = 'lightbox-audio-icon';
      icon.textContent = '♪';
      card.appendChild(icon);

      const name = document.createElement('div');
      name.className = 'lightbox-audio-name';
      name.textContent = a.filename;
      name.title = a.filename;
      card.appendChild(name);

      const audio = document.createElement('audio');
      audio.src = a.url;
      audio.controls = true;
      audio.autoplay = true;
      card.appendChild(audio);

      lightboxContent.appendChild(card);
    } else {
      return;
    }

    lightbox.classList.remove('hidden');
    applyLightboxTransform();
  }

  function closeLightbox() {
    // 재생 중인 미디어를 멈추고 내용을 비운다.
    const media = lightboxContent.querySelector('video, audio');
    if (media) {
      try {
        media.pause();
      } catch (err) {
        /* ignore */
      }
    }
    lightboxContent.innerHTML = '';
    lightbox.classList.add('hidden');
    state.lightboxList = [];
    state.lightboxIndex = -1;
    resetLightboxZoom();
  }
  lightbox.addEventListener('click', closeLightbox);

  // 확대된 이미지/동영상 위에서 마우스 휠을 굴리면 크기를 조절한다.
  lightboxContent.addEventListener(
    'wheel',
    (e) => {
      const media = currentLightboxMedia();
      if (!media) return;
      e.preventDefault();
      e.stopPropagation();
      const delta = e.deltaY < 0 ? LIGHTBOX_ZOOM_STEP : -LIGHTBOX_ZOOM_STEP;
      const next = Math.min(LIGHTBOX_ZOOM_MAX, Math.max(LIGHTBOX_ZOOM_MIN, state.lightboxZoom + delta));
      state.lightboxZoom = next;
      if (next <= 1) {
        // 원래 크기로 돌아오면 옮겼던 위치도 함께 가운데로 되돌린다.
        state.lightboxPanX = 0;
        state.lightboxPanY = 0;
      }
      applyLightboxTransform();
    },
    { passive: false }
  );

  lightboxPrev.addEventListener('click', (e) => {
    e.stopPropagation();
    goToLightboxIndex(state.lightboxIndex - 1);
  });
  lightboxNext.addEventListener('click', (e) => {
    e.stopPropagation();
    goToLightboxIndex(state.lightboxIndex + 1);
  });

  function closeDetail() {
    overlay.classList.remove('show');
    setTimeout(() => overlay.classList.add('hidden'), 200);
    state.selectedDate = null;
    refreshSummary().then(renderCalendar);
  }
  closeDetailBtn.addEventListener('click', closeDetail);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeDetail();
  });

  memoInput.addEventListener('input', () => {
    saveStatus.textContent = '저장 중...';
    clearTimeout(state.saveTimer);
    state.saveTimer = setTimeout(async () => {
      if (!state.selectedDate) return;
      try {
        const ok = await window.daylogAPI.saveMemo(state.selectedDate, memoInput.value);
        saveStatus.textContent = ok ? '저장됨' : '저장 실패';
        if (ok) {
          state.recordsSummary[state.selectedDate] = {
            ...(state.recordsSummary[state.selectedDate] || {}),
            hasMemo: memoInput.value.trim().length > 0,
            memoPreview: memoInput.value.trim().slice(0, 60),
          };
        }
      } catch (err) {
        console.error(err);
        saveStatus.textContent = '저장 실패';
      }
    }, 600);
  });

  // ---------- 왼쪽 메모 사이드바 (가장자리 호버 트리거로 열고, 바깥 클릭으로 닫기) ----------
  function syncMemoTrigger() {
    memoTabBtn.classList.toggle('is-hidden', memoDock.classList.contains('open'));
  }
  function toggleMemoDock() {
    memoDock.classList.toggle('open');
    syncMemoTrigger();
  }
  function closeMemoDock() {
    memoDock.classList.remove('open');
    syncMemoTrigger();
  }
  memoTabBtn.addEventListener('click', toggleMemoDock);

  // 메모 공간이 아닌 곳을 클릭하면 사이드바를 접는다 (트리거 버튼 자체 클릭은 toggle이 처리하므로 제외).
  document.addEventListener('click', (e) => {
    if (!memoDock.classList.contains('open')) return;
    if (memoDock.contains(e.target) || memoTabBtn.contains(e.target)) return;
    closeMemoDock();
  });

  let memoPadSaveTimer = null;
  memoPadInput.addEventListener('input', () => {
    state.settings.notePad = memoPadInput.value;
    clearTimeout(memoPadSaveTimer);
    memoPadSaveTimer = setTimeout(async () => {
      try {
        await window.daylogAPI.saveSettings({ notePad: memoPadInput.value });
      } catch (err) {
        console.error(err);
      }
    }, 400);
  });

  // ---------- 설정 탭 (배경 흐림도) ----------
  function openSettings() {
    settingsOverlay.classList.remove('hidden');
    requestAnimationFrame(() => settingsOverlay.classList.add('show'));
  }
  function closeSettings() {
    settingsOverlay.classList.remove('show');
    setTimeout(() => settingsOverlay.classList.add('hidden'), 200);
  }
  settingsBtn.addEventListener('click', openSettings);
  closeSettingsBtn.addEventListener('click', closeSettings);
  settingsOverlay.addEventListener('click', (e) => {
    if (e.target === settingsOverlay) closeSettings();
  });

  function saveSettingsDebounced(partial) {
    clearTimeout(state.settingsSaveTimer);
    state.settingsSaveTimer = setTimeout(async () => {
      try {
        await window.daylogAPI.saveSettings(partial);
      } catch (err) {
        console.error(err);
      }
    }, 300);
  }

  settingBlurSlider.addEventListener('input', () => {
    const val = Number(settingBlurSlider.value);
    settingBlurValue.textContent = String(val);
    applyBgBlurVar(val);
    state.settings.bgBlur = val;
    saveSettingsDebounced({ bgBlur: val });
  });

  settingDayPhotoBlurSlider.addEventListener('input', () => {
    const val = Number(settingDayPhotoBlurSlider.value);
    settingDayPhotoBlurValue.textContent = String(val);
    applyDayPhotoBlurVar(val);
    state.settings.dayPhotoBlur = val;
    saveSettingsDebounced({ dayPhotoBlur: val });
  });

  settingFontSizeSlider.addEventListener('input', () => {
    const val = Number(settingFontSizeSlider.value);
    settingFontSizeValue.textContent = `${val}%`;
    applyFontScaleVar(val);
    state.settings.fontScale = val;
    saveSettingsDebounced({ fontScale: val });
    fitDayMemos(); // 글자 크기가 바뀌면 칸에 들어가는 줄 수도 다시 계산해야 한다
  });

  // ---------- 인터랙션 효과 토글 (날짜 칸 돋보기 효과 켜고 끄기) ----------
  function syncInteractionEffectsToggle() {
    const on = state.settings.interactionEffects !== false;
    settingInteractionEffectsBtn.setAttribute('aria-checked', String(on));
  }
  settingInteractionEffectsBtn.addEventListener('click', () => {
    const next = !(state.settings.interactionEffects !== false);
    state.settings.interactionEffects = next;
    syncInteractionEffectsToggle();
    saveSettingsDebounced({ interactionEffects: next });
    if (!next) resetMagnify(); // 끄는 즉시 지금 커져 있는 칸이 있다면 원래 크기로
  });

  // ---------- 효과음 토글 (날짜 선택 · 하이라이트 · 버튼 클릭 시 재생) ----------
  function syncSoundEffectsToggle() {
    const on = state.settings.soundEffects !== false;
    settingSoundEffectsBtn.setAttribute('aria-checked', String(on));
  }
  settingSoundEffectsBtn.addEventListener('click', () => {
    const next = !(state.settings.soundEffects !== false);
    state.settings.soundEffects = next;
    syncSoundEffectsToggle();
    saveSettingsDebounced({ soundEffects: next });
  });

  // ---------- 날짜 배경 모드 전환 (왼쪽 상단 버튼: 사진 모드 ↔ 색상 모드) ----------
  // 텍스트 기호('▭'/'●')는 두 모드가 한눈에 잘 구분되지 않아서, 실루엣 자체가
  // 뚜렷이 다른 SVG 아이콘으로 바꿨다: 사진 모드는 윤곽선 사진 프레임,
  // 색상 모드는 채워진 물방울(페인트) 모양이라 아이콘만 보고도 바로 구분된다.
  const ICON_PHOTO_MODE = '<svg viewBox="0 0 24 24" fill="none"><rect x="3.25" y="5.5" width="17.5" height="13" rx="2.2" stroke="currentColor" stroke-width="1.6"/><circle cx="8.4" cy="10" r="1.35" fill="currentColor"/><path d="M20.5 15.2l-5.6-5.6a1.6 1.6 0 00-2.26 0L5.5 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const ICON_COLOR_MODE = '<svg viewBox="0 0 24 24" fill="none"><path d="M12 2.8c-.35 0-.68.15-.92.42C8.6 6.5 5.3 10.9 5.3 14.3a6.7 6.7 0 0013.4 0c0-3.4-3.3-7.8-6.78-11.08a1.24 1.24 0 00-.92-.42z" fill="currentColor"/></svg>';

  function syncDayBgModeBtn() {
    const mode = state.settings.dayBgMode || 'photo';
    if (mode === 'color') {
      dayBgModeBtn.innerHTML = ICON_COLOR_MODE;
      dayBgModeBtn.title = '날짜 배경: 색상 모드';
      dayBgModeBtn.classList.add('is-color-mode');
    } else {
      dayBgModeBtn.innerHTML = ICON_PHOTO_MODE;
      dayBgModeBtn.title = '날짜 배경: 사진 모드';
      dayBgModeBtn.classList.remove('is-color-mode');
    }
  }
  dayBgModeBtn.addEventListener('click', () => {
    const nextMode = (state.settings.dayBgMode || 'photo') === 'photo' ? 'color' : 'photo';
    state.settings.dayBgMode = nextMode;
    syncDayBgModeBtn();
    renderCalendar();
    saveSettingsDebounced({ dayBgMode: nextMode });
    showToast(nextMode === 'color' ? '날짜 배경: 색상 모드' : '날짜 배경: 사진 모드');
  });

  // ---------- 날짜 칸 색상 팝오버 (오른쪽 클릭) ----------
  function rgbToHex(r, g, b) {
    return '#' + [r, g, b].map((v) => Math.max(0, Math.min(255, v)).toString(16).padStart(2, '0')).join('');
  }
  function hexToRgb(hex) {
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');
    if (!m) return { r: 24, g: 24, b: 26 };
    return { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) };
  }
  // 배경색이 밝은지(흰색에 가까운지) 판단해서, 밝으면 글자를 어둡게 바꿔야
  // 시인성이 유지된다 (기본 글자색은 어두운 배경을 가정한 밝은 색이라 흰색
  // 배경 위에서는 거의 안 보이는 문제가 있었다).
  function isLightColor(hex) {
    const { r, g, b } = hexToRgb(hex);
    const yiq = (r * 299 + g * 587 + b * 114) / 1000;
    return yiq >= 150;
  }
  // 토스 스타일 기본 날짜 칸 색 (라이트: 흰색 카드 / 다크: 어두운 카드)
  const DEFAULT_DAY_COLOR = window.matchMedia('(prefers-color-scheme: dark)').matches ? '#202027' : '#ffffff';

  function updateColorSlidersUI() {
    const r = Number(colorR.value);
    const g = Number(colorG.value);
    const b = Number(colorB.value);
    colorRVal.textContent = String(r);
    colorGVal.textContent = String(g);
    colorBVal.textContent = String(b);
    const hex = rgbToHex(r, g, b);
    colorPreview.style.background = hex;
    return hex;
  }

  function applyDayColorToCell(dateKey, hex) {
    const cell = calendarGrid.querySelector(`[data-date="${dateKey}"]`);
    const mode = state.settings.dayBgMode || 'photo';

    // 색은 '색상 모드'일 때만 화면에 표시한다. 사진 우선 모드에서는 값만 저장해 두고
    // 화면(사진/빈 배경)은 건드리지 않는다.
    if (cell && mode === 'color') {
      if (hex) {
        cell.style.backgroundColor = hex;
        cell.classList.add('day-custom-color');
        cell.classList.toggle('day-color-light-bg', isLightColor(hex));

        // 사진이 있는 날짜라도 색상 모드에서는 색이 우선 보여야 하므로
        // 남아있던 사진 배경 레이어를 확실히 지운다.
        cell.style.removeProperty('--day-photo-url');
        cell.classList.remove('day-photo-bg');
      } else {
        // 색을 지운 경우: 색상 모드는 사진을 표시하지 않으므로 배경을 그냥 비워둔다.
        cell.style.backgroundColor = '';
        cell.classList.remove('day-custom-color', 'day-color-light-bg');
        cell.style.removeProperty('--day-photo-url');
        cell.classList.remove('day-photo-bg');
      }
    }
    state.recordsSummary[dateKey] = {
      ...(state.recordsSummary[dateKey] || {}),
      color: hex || null,
    };
  }

  function saveDayColorDebounced(dateKey, hex) {
    clearTimeout(state.colorSaveTimer);
    state.colorSaveTimer = setTimeout(async () => {
      try {
        await window.daylogAPI.saveDayColor(dateKey, hex);
      } catch (err) {
        console.error(err);
      }
    }, 250);
  }

  // 캘린더에서 이미 쓰이고 있는 색상들을 모아 프리셋으로 보여준다.
  function buildColorPresets() {
    colorPresets.innerHTML = '';
    const colors = new Set();
    for (const info of Object.values(state.recordsSummary)) {
      if (info && info.color) colors.add(info.color.toLowerCase());
    }
    const list = Array.from(colors).slice(0, 16);
    if (list.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'color-presets-empty';
      empty.textContent = '아직 사용된 색상이 없어요.';
      colorPresets.appendChild(empty);
      return;
    }
    for (const hex of list) {
      const isEditingThis = !!state.paletteEditHex && state.paletteEditHex === hex.toLowerCase();

      const sw = document.createElement('button');
      sw.type = 'button';
      sw.className = 'color-preset-swatch';
      sw.classList.toggle('is-editing', isEditingThis);
      sw.style.background = hex;
      sw.title = isEditingThis
        ? `${hex} · 편집 중 — 우클릭하면 편집을 마쳐요`
        : `${hex} · 클릭: 이 날짜에 적용 / 우클릭: 이 색을 쓰는 모든 날짜를 함께 편집`;
      sw.addEventListener('click', () => {
        if (state.paletteEditHex) return; // 특정 색을 편집하는 중에는 클릭으로 다른 색을 고르지 않는다
        const { r, g, b } = hexToRgb(hex);
        colorR.value = r;
        colorG.value = g;
        colorB.value = b;
        updateColorSlidersUI();
        if (!state.colorPopoverDate) return;
        applyDayColorToCell(state.colorPopoverDate, hex);
        saveDayColorDebounced(state.colorPopoverDate, hex);
      });
      sw.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (isEditingThis) {
          exitPaletteEditMode();
        } else {
          enterPaletteEditMode(hex);
        }
      });
      colorPresets.appendChild(sw);
    }
  }

  function positionColorPopover(e) {
    colorPopover.style.left = '0px';
    colorPopover.style.top = '0px';
    const offset = 6;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const rect = colorPopover.getBoundingClientRect();
    let x = e.clientX + offset;
    let y = e.clientY + offset;
    if (x + rect.width > vw - 8) x = e.clientX - rect.width - offset;
    if (y + rect.height > vh - 8) y = e.clientY - rect.height - offset;
    if (x < 8) x = 8;
    if (y < 8) y = 8;
    colorPopover.style.left = `${x}px`;
    colorPopover.style.top = `${y}px`;
  }

  function openColorPopover(dateKey, e) {
    e.preventDefault();
    exitPaletteEditMode(); // 새로 여는 날짜는 항상 일반 편집 상태로 시작한다
    state.colorPopoverDate = dateKey;

    const info = state.recordsSummary[dateKey];
    const current = (info && info.color) || DEFAULT_DAY_COLOR;
    const { r, g, b } = hexToRgb(current);
    colorR.value = r;
    colorG.value = g;
    colorB.value = b;
    updateColorSlidersUI();
    buildColorPresets();

    colorPopover.classList.remove('hidden');
    positionColorPopover(e);
  }

  function closeColorPopover() {
    colorPopover.classList.add('hidden');
    state.colorPopoverDate = null;
    exitPaletteEditMode();
  }

  // ---------- 프리셋 우클릭으로 시작하는 "이 색을 쓰는 모든 날짜" 실시간 편집 ----------
  // 프리셋 스와치를 우클릭하면 그 색상 편집 모드로 들어간다: 우클릭한 스와치에는
  // 테두리 하이라이트가 표시되고, 이후 RGB 슬라이더를 움직이면 그 즉시(디바운스)
  // 이 색을 쓰던 모든 날짜의 색이 함께 바뀐다. 같은 스와치를 다시 우클릭하거나,
  // 원래 있던 "기본값으로" 버튼을 누르면(이 경우 이 색을 쓰는 날짜만 초기화) 편집이 끝난다.
  // 버튼 구성이 편집 모드로 들어가도 그대로라 팝오버 UI가 바뀌지 않는다.
  function enterPaletteEditMode(hex) {
    state.paletteEditHex = hex.toLowerCase();
    const { r, g, b } = hexToRgb(hex);
    colorR.value = r;
    colorG.value = g;
    colorB.value = b;
    updateColorSlidersUI();
    buildColorPresets();
  }

  function exitPaletteEditMode() {
    if (!state.paletteEditHex) return;
    state.paletteEditHex = null;
    clearTimeout(state.paletteRecolorTimer);
    buildColorPresets();
  }

  // 편집 중인 색상을 쓰는 모든 날짜를 실시간으로(짧게 디바운스해서) 함께 바꾼다.
  function recolorPaletteDebounced(oldHex, newHex) {
    clearTimeout(state.paletteRecolorTimer);
    state.paletteRecolorTimer = setTimeout(async () => {
      if (!oldHex || !newHex || oldHex.toLowerCase() === newHex.toLowerCase()) return;
      try {
        const result = await window.daylogAPI.recolorAllDayColor(oldHex, newHex);
        if (result && result.ok) {
          for (const [date, info] of Object.entries(state.recordsSummary)) {
            if (info && info.color && info.color.toLowerCase() === oldHex.toLowerCase()) {
              state.recordsSummary[date] = { ...info, color: newHex };
            }
          }
          state.paletteEditHex = newHex.toLowerCase();
          renderCalendar();
          buildColorPresets();
        }
      } catch (err) {
        console.error(err);
      }
    }, 160);
  }

  [colorR, colorG, colorB].forEach((input) => {
    input.addEventListener('input', () => {
      const hex = updateColorSlidersUI();
      if (state.paletteEditHex) {
        recolorPaletteDebounced(state.paletteEditHex, hex);
        return;
      }
      if (!state.colorPopoverDate) return;
      applyDayColorToCell(state.colorPopoverDate, hex);
      saveDayColorDebounced(state.colorPopoverDate, hex);
    });
  });

  colorResetBtn.addEventListener('click', async () => {
    if (state.paletteEditHex) {
      // 원래 있던 "기본값으로" 버튼: 우클릭으로 편집 중이던 색을 쓰는 날짜만 색을 없앤다.
      const hex = state.paletteEditHex;
      colorResetBtn.disabled = true;
      try {
        const result = await window.daylogAPI.resetDayColorByHex(hex);
        if (result && result.ok) {
          for (const [date, info] of Object.entries(state.recordsSummary)) {
            if (info && info.color && info.color.toLowerCase() === hex.toLowerCase()) {
              const { color, ...rest } = info;
              state.recordsSummary[date] = rest;
            }
          }
          renderCalendar();
          showToast(result.count > 0 ? `${result.count}개 날짜의 색상을 기본값으로 되돌렸어요.` : '되돌릴 색상이 없었어요.');
        } else {
          showToast('색상을 초기화하지 못했습니다.');
        }
      } catch (err) {
        console.error(err);
        showToast('색상을 초기화하는 중 오류가 발생했습니다.');
      } finally {
        colorResetBtn.disabled = false;
        exitPaletteEditMode();
        closeColorPopover();
      }
      return;
    }
    if (!state.colorPopoverDate) return;
    applyDayColorToCell(state.colorPopoverDate, null);
    saveDayColorDebounced(state.colorPopoverDate, null);
    closeColorPopover();
  });

  document.addEventListener('mousedown', (e) => {
    if (!colorPopover.classList.contains('hidden') && !colorPopover.contains(e.target)) {
      closeColorPopover();
    }
  });

  // ---------- 첨부파일 등록 후 화면 갱신 공통 처리 ----------
  async function afterAttachmentsChanged() {
    if (!state.selectedDate) return;
    const record = await window.daylogAPI.getRecord(state.selectedDate);
    state.currentAttachments = record.attachments || [];
    renderAttachments(state.currentAttachments);
    updateDetailBackground(state.currentAttachments);

    state.recordsSummary[state.selectedDate] = {
      ...(state.recordsSummary[state.selectedDate] || {}),
      hasAttachments: record.attachments.length > 0,
      attachments: record.attachments,
    };
  }

  addFileBtn.addEventListener('click', async () => {
    if (!state.selectedDate) return;
    addFileBtn.disabled = true;
    try {
      const response = await window.daylogAPI.addAttachment(state.selectedDate);
      if (!response || response.canceled) return;

      const results = response.results || [];
      const errors = results.filter((r) => r && r.error);
      if (errors.length > 0) {
        showToast(errors[0].error + (errors.length > 1 ? ` 외 ${errors.length - 1}건` : ''));
      }
      if (results.some((r) => r && !r.error)) {
        await afterAttachmentsChanged();
      }
    } catch (err) {
      console.error(err);
      showToast('파일 첨부 중 오류가 발생했습니다.');
    } finally {
      addFileBtn.disabled = false;
    }
  });

  // ---------- 드래그 앤 드롭으로 파일 첨부 ----------
  // Electron은 창 어디에든 파일이 드롭되면 기본적으로 그 파일을 새 페이지로
  // 열려고 시도하므로, 문서 전체에서 기본 동작을 막아준다.
  document.addEventListener('dragover', (e) => e.preventDefault());
  document.addEventListener('drop', (e) => e.preventDefault());

  let dragCounter = 0;
  attachmentsSection.addEventListener('dragenter', (e) => {
    e.preventDefault();
    if (draggingId) return; // 첨부파일 순서를 바꾸는 내부 드래그 중에는 "파일 추가" 안내를 띄우지 않는다.
    dragCounter += 1;
    dropOverlay.classList.remove('hidden');
    attachmentsSection.classList.add('dragover');
  });
  attachmentsSection.addEventListener('dragover', (e) => {
    e.preventDefault();
    if (draggingId) return;
    e.dataTransfer.dropEffect = 'copy';
  });
  attachmentsSection.addEventListener('dragleave', (e) => {
    e.preventDefault();
    if (draggingId) return;
    dragCounter = Math.max(0, dragCounter - 1);
    if (dragCounter === 0) {
      dropOverlay.classList.add('hidden');
      attachmentsSection.classList.remove('dragover');
    }
  });
  attachmentsSection.addEventListener('drop', async (e) => {
    e.preventDefault();
    dragCounter = 0;
    dropOverlay.classList.add('hidden');
    attachmentsSection.classList.remove('dragover');

    if (draggingId) return; // 내부 순서 변경 드롭은 attachment-item의 drop 핸들러가 이미 처리했다.
    if (!state.selectedDate) return;
    const files = Array.from(e.dataTransfer.files || []);
    if (files.length === 0) return;

    let errorMsg = null;
    let errorCount = 0;
    let addedAny = false;

    for (const file of files) {
      // Electron File 객체는 실제 디스크 경로를 file.path로 노출한다.
      const filePath = file;
      try {
        const result = await window.daylogAPI.addAttachmentFromPath(state.selectedDate, filePath);
        if (result && result.error) {
          errorCount += 1;
          if (!errorMsg) errorMsg = result.error;
        } else if (result) {
          addedAny = true;
        }
      } catch (err) {
        console.error(err);
        errorCount += 1;
      }
    }

    if (addedAny) await afterAttachmentsChanged();
    if (errorMsg) {
      showToast(errorMsg + (errorCount > 1 ? ` 외 ${errorCount - 1}건` : ''));
    }
  });

  async function deleteAttachment(id) {
    if (!state.selectedDate) return;
    try {
      await window.daylogAPI.deleteAttachment(state.selectedDate, id);
      await afterAttachmentsChanged();
    } catch (err) {
      console.error(err);
      showToast('파일 삭제 중 오류가 발생했습니다.');
    }
  }

  deleteRecordBtn.addEventListener('click', async () => {
    if (!state.selectedDate) return;
    const confirmed = confirm('이 날의 기록을 모두 삭제하시겠습니까? 되돌릴 수 없습니다.');
    if (!confirmed) return;
    try {
      await window.daylogAPI.deleteRecord(state.selectedDate);
      showToast('기록이 삭제되었습니다.');
      closeDetail();
    } catch (err) {
      console.error(err);
      showToast('기록 삭제 중 오류가 발생했습니다.');
    }
  });

  // ---------- 캘린더 이동 (월 단위 / 년 단위) ----------
  prevMonthBtn.addEventListener('click', () => {
    state.month -= 1;
    if (state.month < 0) {
      state.month = 11;
      state.year -= 1;
    }
    renderCalendar();
  });
  nextMonthBtn.addEventListener('click', () => {
    state.month += 1;
    if (state.month > 11) {
      state.month = 0;
      state.year += 1;
    }
    renderCalendar();
  });
  prevYearBtn.addEventListener('click', () => {
    state.year -= 1;
    renderCalendar();
  });
  nextYearBtn.addEventListener('click', () => {
    state.year += 1;
    renderCalendar();
  });
  // 다른 달을 보고 있을 때 화면에 표시된 달을 그대로 바꿔치기하지 않고,
  // 이동 방향(과거/미래)에 맞춰 좌우로 슬라이드시키며(+효과음) 자연스럽게 전환한다.
  // 이미 같은 달을 보고 있다면 애니메이션 없이 즉시 끝난다.
  function goToMonth(targetYear, targetMonth) {
    const isSame = state.year === targetYear && state.month === targetMonth;
    if (isSame) return Promise.resolve();

    const forward = targetYear > state.year || (targetYear === state.year && targetMonth > state.month);
    const direction = forward ? 'next' : 'prev';

    if (prefersReducedMotion) {
      state.year = targetYear;
      state.month = targetMonth;
      renderCalendar();
      return Promise.resolve();
    }

    playScrollSound(direction);
    calendarGrid.classList.add(direction === 'next' ? 'slide-out-left' : 'slide-out-right');

    return new Promise((resolve) => {
      setTimeout(() => {
        state.year = targetYear;
        state.month = targetMonth;
        renderCalendar();
        calendarGrid.classList.remove('slide-out-left', 'slide-out-right');
        calendarGrid.classList.add(direction === 'next' ? 'slide-in-right' : 'slide-in-left');
        setTimeout(() => {
          calendarGrid.classList.remove('slide-in-right', 'slide-in-left');
          resolve();
        }, 240);
      }, 150);
    });
  }

  // 오늘 날짜 칸에 잠깐 펄스 하이라이트를 표시한다. (같은 달 안에서 다시 눌러도
  // 애니메이션이 재시작되도록 클래스를 한번 떼었다가 다시 붙인다.)
  // TODAY 버튼을 짧은 시간 안에 연타하면, 이전 클릭이 걸어둔 "900ms 뒤 클래스 제거"
  // setTimeout이 나중 클릭보다 먼저 발동해서 지금 막 시작한 애니메이션을 중간에
  // 끊어버리는(하이라이트가 씹히는) 문제가 있었다. 타이머를 하나만 유지하고 새로
  // 하이라이트를 걸 때마다 이전 타이머를 취소해서 항상 마지막 클릭 기준으로
  // 900ms를 꽉 채우고 나서만 제거되도록 한다.
  let todayFlashTimer = null;
  function highlightTodayCell() {
    const now = new Date();
    const todayKey = formatDateKey(now.getFullYear(), now.getMonth(), now.getDate());
    const cell = calendarGrid.querySelector(`[data-date="${todayKey}"]`);
    if (!cell) return;
    clearTimeout(todayFlashTimer);
    cell.classList.remove('today-flash');
    void cell.offsetWidth; // 리플로우를 강제해서 애니메이션을 재시작한다
    cell.classList.add('today-flash');
    todayFlashTimer = setTimeout(() => {
      cell.classList.remove('today-flash');
      todayFlashTimer = null;
    }, 900);
  }

  todayBtn.addEventListener('click', async () => {
    const now = new Date();
    await goToMonth(now.getFullYear(), now.getMonth());
    highlightTodayCell();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (!colorPopover.classList.contains('hidden')) {
        closeColorPopover();
      } else if (!lightbox.classList.contains('hidden')) {
        closeLightbox();
      } else if (!settingsOverlay.classList.contains('hidden')) {
        closeSettings();
      } else if (!overlay.classList.contains('hidden')) {
        closeDetail();
      } else if (memoDock.classList.contains('open')) {
        closeMemoDock();
      }
      return;
    }
    if (!lightbox.classList.contains('hidden') && state.lightboxList.length > 1) {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        goToLightboxIndex(state.lightboxIndex - 1);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        goToLightboxIndex(state.lightboxIndex + 1);
      }
    }
  });

  async function loadAndApplySettings() {
    try {
      const loaded = await window.daylogAPI.getSettings();
      state.settings = { ...state.settings, ...loaded };
    } catch (err) {
      console.error(err);
    }
    applyBgBlurVar(state.settings.bgBlur);
    settingBlurSlider.value = state.settings.bgBlur;
    settingBlurValue.textContent = String(state.settings.bgBlur);

    applyDayPhotoBlurVar(state.settings.dayPhotoBlur);
    settingDayPhotoBlurSlider.value = state.settings.dayPhotoBlur;
    settingDayPhotoBlurValue.textContent = String(state.settings.dayPhotoBlur);

    applyFontScaleVar(state.settings.fontScale || 100);
    settingFontSizeSlider.value = state.settings.fontScale || 100;
    settingFontSizeValue.textContent = `${state.settings.fontScale || 100}%`;

    memoPadInput.value = state.settings.notePad || '';

    syncDayBgModeBtn();
    syncInteractionEffectsToggle();
    syncSoundEffectsToggle();
  }

  async function init() {
    await loadAndApplySettings();
    await refreshSummary();
    renderCalendar();
  }

  init();
})();

</script>
</body>
</html>
