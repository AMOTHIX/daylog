<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DayLog</title>
<style>
/* =====================================================================
   DayLog — 토스(Toss) 스타일 UI
   - 토스 디자인 시스템(TDS)의 색/반경/타이포 감각을 따른다:
     회색 배경 위의 흰 카드, 토스 블루(#3182f6) 강조, 큼직한 굵은 제목,
     그림자는 얕고 부드럽게, 버튼은 둥글고 채워진 형태.
   - 라이트가 기본이고 macOS가 다크 모드면 토스 다크 팔레트로 자동 전환.
   ===================================================================== */
:root {
  --bg: #f2f4f6;
  --surface: #ffffff;
  --surface-sub: #f9fafb;
  --border: #e5e8eb;
  --text: #191f28;
  --text-dim: #6b7684;
  --text-faint: #b0b8c1;
  --accent: #3182f6;
  --accent-weak: #e8f3ff;
  --on-accent: #ffffff;
  --danger: #f04452;
  --danger-weak: #ffeeee;
  --sunday: #f04452;
  --saturday: #3182f6;
  --scrim: rgba(25, 31, 40, 0.5);
  --toast-bg: #191f28;
  --toast-text: #ffffff;
  --shadow-card: 0 1px 2px rgba(25, 31, 40, 0.04);
  --shadow-float: 0 12px 32px rgba(25, 31, 40, 0.16);
  --shadow-sheet: 0 20px 60px rgba(25, 31, 40, 0.24);

  --radius: 24px;
  --radius-md: 16px;
  --radius-sm: 12px;
  --transition: 180ms cubic-bezier(0.2, 0, 0, 1);
  --font: "Pretendard", "Pretendard Variable", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Helvetica Neue", sans-serif;
  /* 표면 위에 살짝 겹쳐 톤을 만드는 오버레이 색의 기준 RGB (라이트: 짙은 색, 다크/사진 배경: 흰색). */
  --overlay-rgb: 25, 31, 40;
  /* 상세 패널 배경 흐림도 (설정 탭 슬라이더로 조절, 모든 날짜 공통) */
  --bg-blur: 28px;
  /* 캘린더 일자 칸 사진 배경 흐림도 (설정 탭 슬라이더로 조절) */
  --day-photo-blur: 0px;
  /* 사용자가 작성하는 텍스트 크기 배율 (설정 탭 슬라이더로 조절, 1 = 100%) */
  --content-font-scale: 1;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17171c;
    --surface: #202027;
    --surface-sub: #2c2c35;
    --border: rgba(255, 255, 255, 0.08);
    --text: #f9fafb;
    --text-dim: #b0b8c1;
    --text-faint: #6b7684;
    --accent: #4593fc;
    --accent-weak: rgba(69, 147, 252, 0.16);
    --danger: #f66570;
    --danger-weak: rgba(246, 101, 112, 0.14);
    --sunday: #f66570;
    --saturday: #4593fc;
    --scrim: rgba(0, 0, 0, 0.6);
    --toast-bg: #f9fafb;
    --toast-text: #191f28;
    --shadow-card: none;
    --shadow-float: 0 14px 36px rgba(0, 0, 0, 0.5);
    --shadow-sheet: 0 20px 60px rgba(0, 0, 0, 0.55);
    --overlay-rgb: 255, 255, 255;
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
  overflow: hidden;
}

button {
  font-family: inherit;
  cursor: pointer;
  color: inherit;
}

.titlebar-drag-region {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 40px;
  -webkit-app-region: drag;
  z-index: 0;
}

#app {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  padding: 28px 32px 24px;
}

.topbar {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 6px;
  -webkit-app-region: drag;
  -webkit-user-select: none;
  user-select: none;
}

.nav-group {
  display: flex;
  align-items: center;
  gap: 2px;
  -webkit-app-region: no-drag;
}
.utility-group {
  position: absolute;
  left: 32px;
}

.month-title {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.02em;
  min-width: 168px;
  text-align: center;
  margin: 0;
  padding: 0 8px;
  color: var(--text);
}

/* 토스식 아이콘 버튼: 테두리 없이 투명, 눌렀을 때만 회색 원이 깔린다 */
.icon-btn {
  background: transparent;
  border: none;
  border-radius: 999px;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  line-height: 1;
  color: var(--text-dim);
  transition: background var(--transition), color var(--transition), transform var(--transition);
  -webkit-app-region: no-drag;
}
.icon-btn:hover {
  background: rgba(var(--overlay-rgb), 0.07);
  color: var(--text);
}
.icon-btn:active {
  transform: scale(0.92);
  background: rgba(var(--overlay-rgb), 0.12);
}
.icon-btn svg {
  width: 20px;
  height: 20px;
  display: block;
}

/* 날짜 배경이 "색상 모드"일 때: 토스 블루 톤으로 채워 지금 상태가 한눈에 보이게 한다. */
.day-bg-mode-btn.is-color-mode {
  background: var(--accent-weak);
  color: var(--accent);
}
.day-bg-mode-btn.is-color-mode:hover {
  background: var(--accent-weak);
  filter: brightness(0.97);
}

/* TODAY: 토스의 "보조(Weak) 버튼" — 연한 파란 배경 + 파란 굵은 글씨 */
.today-btn {
  position: absolute;
  right: 32px;
  background: var(--accent-weak);
  border: none;
  border-radius: 999px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  transition: filter var(--transition), transform var(--transition);
  -webkit-app-region: no-drag;
}
.today-btn:hover { filter: brightness(0.96); }
.today-btn:active { transform: scale(0.96); }

.weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-dim);
  padding: 20px 0 10px;
}
.weekdays span:first-child { color: var(--sunday); }
.weekdays span:last-child { color: var(--saturday); }

.calendar-grid {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  /* 주의: grid-auto-rows: 1fr 은 내부적으로 minmax(auto, 1fr)로 취급되어, 칸 안
     내용(메모 텍스트 등)의 최소 크기보다 행이 작아지지 못한다. 그래서 창을
     최소 크기까지 줄이면 행들이 강제로 늘어나며 마지막 줄 날짜 칸들이 창
     밖으로 밀려나는(튀어나오는) 문제가 있었다. minmax(0, 1fr)로 바꿔서 행이
     필요하면 0까지도 줄어들 수 있게 하고, 대신 각 칸 내부 요소들이 실제
     남는 공간에 맞춰 스스로 조절되도록 한다(day-memo 줄 수는 JS가 계산).*/
  grid-auto-rows: minmax(0, 1fr);
  gap: 8px;
}

/* ---------- TODAY 버튼으로 다른 달에서 이동할 때의 좌우 슬라이드 전환 ---------- */
@keyframes calendarSlideOutLeft {
  to { transform: translateX(-28px); opacity: 0; }
}
@keyframes calendarSlideOutRight {
  to { transform: translateX(28px); opacity: 0; }
}
@keyframes calendarSlideInFromRight {
  from { transform: translateX(28px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
@keyframes calendarSlideInFromLeft {
  from { transform: translateX(-28px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
.calendar-grid.slide-out-left { animation: calendarSlideOutLeft 150ms ease-in forwards; }
.calendar-grid.slide-out-right { animation: calendarSlideOutRight 150ms ease-in forwards; }
.calendar-grid.slide-in-right { animation: calendarSlideInFromRight 240ms ease-out; }
.calendar-grid.slide-in-left { animation: calendarSlideInFromLeft 240ms ease-out; }

/* ---------- TODAY 버튼을 눌렀을 때 오늘 날짜 칸에 표시하는 하이라이트 펄스 ---------- */
@keyframes todayFlashPulse {
  0% { box-shadow: 0 0 0 0 rgba(49, 130, 246, 0.45), 0 0 0 2px #3182f6; }
  70% { box-shadow: 0 0 0 14px rgba(49, 130, 246, 0), 0 0 0 2px #3182f6; }
  100% { box-shadow: 0 0 0 0 rgba(49, 130, 246, 0), 0 0 0 2px rgba(49, 130, 246, 0); }
}
.day.today-flash {
  animation: todayFlashPulse 0.9s ease-out;
  z-index: 6;
}

/* ---------- 날짜 칸: 회색 배경 위에 떠 있는 흰 카드 ---------- */
.day {
  position: relative;
  background: var(--surface);
  border: none;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-start;
  padding: 12px;
  overflow: hidden;
  transition: background var(--transition), box-shadow var(--transition), filter var(--transition),
    transform 320ms cubic-bezier(0.34, 1.56, 0.64, 1);
}
.day.empty {
  background: transparent;
  box-shadow: none;
  pointer-events: none;
}
/* ---------- 마우스를 올린 칸이 커지면서 주변 칸을 밀어내는 "돋보기" 효과 ----------
   실제 이동/확대 값은 JS(magnifyAroundCell)가 마우스가 올라간 칸과의 거리에 따라
   계산해서 각 칸의 inline transform으로 준다. 여기서는 그 값이 부드럽고
   탄력있게(bounce) 애니메이션되도록 transform 전용 transition만 담당한다. */
.day.day-magnified {
  z-index: 30;
  box-shadow: var(--shadow-float);
}
/* 사진도 색도 없는 "빈" 칸만 hover 시 배경이 살짝 바뀐다
   (사진/색 칸은 각자의 전용 hover 규칙에서 처리 — 하이라이트가 두 번 먹지 않도록). */
.day:not(.empty):not(.day-photo-bg):not(.day-custom-color):hover {
  background: var(--surface-sub);
}
.day-num {
  position: relative;
  z-index: 2;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}
/* 일요일/토요일 날짜 숫자는 토스 캘린더처럼 빨강/파랑 (일요일 = 7n+1, 토요일 = 7n) */
.day:nth-child(7n+1):not(.day-photo-bg):not(.day-custom-color):not(.today) .day-num { color: var(--sunday); }
.day:nth-child(7n):not(.day-photo-bg):not(.day-custom-color):not(.today) .day-num { color: var(--saturday); }

.day-memo {
  position: relative;
  z-index: 2;
  margin-top: 6px;
  font-size: calc(11px * var(--content-font-scale));
  line-height: 1.4;
  color: var(--text-dim);
  text-align: left;
  overflow: hidden;
  display: -webkit-box;
  /* 기본값(폴백)일 뿐이고, 실제 줄 수는 JS(fitDayMemos)가 칸의 남는 공간을
     계산해서 인라인 스타일로 매번 정확히 지정한다 (잘리지 않는 선까지). */
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  word-break: break-word;
  /* 상세화면에서 입력한 줄바꿈이 메인화면 미리보기에도 그대로 보이도록 유지 */
  white-space: pre-line;
}
/* 오늘: 토스 블루 원 + 흰 글씨 */
.day.today .day-num {
  color: var(--on-accent);
  background: var(--accent);
  border-radius: 999px;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
}
/* 기록이 있는 날은 테두리 대신 아주 연한 파란 링으로 표시 */
.day.has-record {
  box-shadow: inset 0 0 0 1px rgba(49, 130, 246, 0.14), var(--shadow-card);
}
.day-marks {
  position: relative;
  z-index: 2;
  margin-top: auto;
  display: flex;
  gap: 5px;
}
.mark {
  width: 6px;
  height: 6px;
  border-radius: 999px;
}
.mark-memo { background: var(--accent); }
.mark-file { background: var(--text-faint); }

/* ---------- 오른쪽 클릭으로 지정한 색 배경 ---------- */
/* 기본 글자색은 "밝은 배경" 기준(어두운 글씨)이다. JS가 배경색의 밝기(YIQ)를 계산해
   어두운 색이면 day-color-light-bg 클래스를 붙이지 않으므로, 그 경우에만 글자를 흰색으로
   바꿔서 항상 대비가 유지되도록 한다. */
.day.day-custom-color .day-num,
.day.day-custom-color .day-memo,
.day.day-custom-color .mark-memo,
.day.day-custom-color .mark-file {
  transition: color var(--transition), background var(--transition), border-color var(--transition);
}
.day.day-custom-color:not(.day-color-light-bg) .day-num { color: #ffffff; }
.day.day-custom-color:not(.day-color-light-bg) .day-memo { color: rgba(255, 255, 255, 0.86); }
.day.day-custom-color:not(.day-color-light-bg) .mark-memo { background: #ffffff; }
.day.day-custom-color:not(.day-color-light-bg) .mark-file { background: rgba(255, 255, 255, 0.55); }
.day.day-custom-color:not(.day-color-light-bg).today .day-num {
  color: rgba(0, 0, 0, 0.82);
  background: #ffffff;
}
.day.day-custom-color.day-color-light-bg .day-num { color: rgba(0, 0, 0, 0.82); }
.day.day-custom-color.day-color-light-bg .day-memo { color: rgba(0, 0, 0, 0.62); }
.day.day-custom-color.day-color-light-bg .mark-memo { background: rgba(0, 0, 0, 0.78); }
.day.day-custom-color.day-color-light-bg .mark-file { background: rgba(0, 0, 0, 0.35); }
.day.day-custom-color.day-color-light-bg.today .day-num {
  color: #ffffff;
  background: rgba(0, 0, 0, 0.82);
}
/* 색을 지정한 칸은 인라인 background-color가 우선하므로 hover는 밝기 필터로 반응을 준다. */
.day.day-custom-color:not(.empty):hover {
  filter: brightness(1.08);
}
.day.day-custom-color.day-color-light-bg:not(.empty):hover {
  filter: brightness(0.96);
}

/* ---------- 사진이 첨부된 날짜: 사진을 칸 배경으로 표시 ---------- */
/* 사진마다 밝기가 달라도 글자가 항상 잘 보이도록,
   아래쪽이 더 어두워지는 그라데이션 스크림을 사진 위에 깔고
   글자는 흰색 + 그림자로 통일해서 시인성을 확보한다.
   사진 자체는 ::before, 스크림은 ::after로 분리해서 사진에만 흐림 효과(blur)를
   줄 수 있게 했다 (blur를 .day에 직접 걸면 글자까지 같이 흐려진다). */
.day.day-photo-bg::before {
  content: "";
  position: absolute;
  /* 흐림 효과를 줄 때 가장자리에 투명한 테두리가 비치는 것을 막기 위해
     칸보다 조금 크게 그려서 overflow: hidden으로 잘라낸다. */
  inset: -12px;
  z-index: 0;
  background-image: var(--day-photo-url);
  background-size: cover;
  background-position: center;
  filter: blur(var(--day-photo-blur, 0px));
  pointer-events: none;
}
.day.day-photo-bg::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  background: linear-gradient(180deg, rgba(0, 0, 0, 0.18) 0%, rgba(0, 0, 0, 0.28) 45%, rgba(0, 0, 0, 0.6) 100%);
  pointer-events: none;
}
.day.day-photo-bg:not(.empty):hover::after {
  background: linear-gradient(180deg, rgba(0, 0, 0, 0.06) 0%, rgba(0, 0, 0, 0.14) 45%, rgba(0, 0, 0, 0.44) 100%);
}
.day.day-photo-bg .day-num {
  color: #ffffff;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
}
.day.day-photo-bg.today .day-num {
  color: #ffffff;
  background: var(--accent);
  text-shadow: none;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
}
.day.day-photo-bg .day-memo {
  color: rgba(255, 255, 255, 0.95);
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
}
.day.day-photo-bg .mark-memo {
  background: #ffffff;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
}
.day.day-photo-bg .mark-file {
  background: rgba(255, 255, 255, 0.85);
}

/* ---------- 왼쪽 메모 사이드바 (가장자리에 마우스를 대면 나타나는 트리거) ---------- */
.memo-edge-trigger {
  position: fixed;
  top: 0;
  left: 0;
  width: 18px;
  height: 100vh;
  z-index: 16;
  background: transparent;
  border: none;
  padding: 0;
  cursor: pointer;
  -webkit-app-region: no-drag;
}
.memo-edge-trigger::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 5px;
  width: 4px;
  height: 56px;
  border-radius: 999px;
  background: var(--accent);
  opacity: 0;
  transform: translateY(-50%) scaleY(0.55);
  transition: opacity 180ms ease, transform 180ms ease;
}
.memo-edge-trigger:hover::before,
.memo-edge-trigger:focus-visible::before {
  opacity: 0.9;
  transform: translateY(-50%) scaleY(1);
}
.memo-edge-trigger.is-hidden {
  pointer-events: none;
}
.memo-edge-trigger.is-hidden::before {
  opacity: 0 !important;
}

.memo-dock {
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  z-index: 15;
  transform: translateX(-292px);
  transition: transform 260ms cubic-bezier(0.2, 0, 0, 1);
  -webkit-app-region: no-drag;
}
.memo-dock.open { transform: translateX(0); }
.memo-panel {
  width: 288px;
  height: 100vh;
  background: var(--surface);
  border-radius: 0 var(--radius) var(--radius) 0;
  box-shadow: var(--shadow-sheet);
  padding: 56px 24px 24px;
  display: flex;
  flex-direction: column;
}
.memo-panel-title {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text);
  margin: 0 0 14px;
}
.memo-pad-input {
  flex: 1;
  width: 100%;
  resize: none;
  border: none;
  outline: none;
  background: transparent;
  color: var(--text);
  font-family: inherit;
  font-size: calc(15px * var(--content-font-scale));
  line-height: 1.7;
}
.memo-pad-input::placeholder { color: var(--text-faint); }
@media (max-width: 720px) {
  .memo-panel { width: 78vw; }
}

/* ---------- 상세 기록 오버레이 (토스 바텀시트 느낌의 큰 둥근 모서리 시트) ---------- */
.overlay {
  position: fixed;
  inset: 0;
  background: var(--scrim);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity var(--transition);
  z-index: 20;
}
.overlay.show { opacity: 1; }
